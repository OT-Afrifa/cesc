[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cesc"
version = "0.1.0"
description = "Identification of convection embedded within or emergent from cold-season stratiform clouds (CESC)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Francis Osei Tutu Afrifa"}]
requires-python = ">=3.7"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    # "pandas>=1.3",
    "pandas>=1.3,<2; python_version < '3.9'",   # xarray stops at 2023.1 on 3.8, which predates pandas 2
    "pandas>=1.3; python_version >= '3.9'",
    "xarray>=0.20",
    "scikit-image>=0.19",
    # "netCDF4>=1.6",   # xarray needs it to open WRF NetCDF-4 files
    "netCDF4>=1.6,<1.6.5; python_version < '3.8'",   # 1.6.4 is the last release with a cp37 wheel
    "netCDF4>=1.6; python_version == '3.8'",
    "netCDF4>=1.7.1; python_version >= '3.9'",       # first release built for NumPy 2
    "PyYAML>=6.0",    # cesc run config.yaml
    "numba>=0.55",    # speed only; results match the numpy path
    "importlib-metadata<5; python_version < '3.8'",  # xarray 0.20 needs the old entry-points API
]

[project.optional-dependencies]
fast = ["numba>=0.50"]
wrf = ["netCDF4", "wrf-python>=1.3.4"]
cli = ["PyYAML"]
plot = ["matplotlib>=3.5", "cartopy>=0.20"] # the quicklook figure
dev  = ["pytest>=6", "ruff"]
all  = ["wrf-python>=1.3.4", "matplotlib>=3.5", "cartopy>=0.20"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/OT-Afrifa/cesc"

[project.scripts]
cesc = "cesc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
